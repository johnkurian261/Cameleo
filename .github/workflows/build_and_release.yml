name: Build & Release dazzz APK

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Distribution
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/dazzz.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dazzz-APK
          path: release-apk/dazzz.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "dazzz v2.1.0 — Vintage Analog Camera for Android"
          body: |
            ## 📸 dazzz v2.1.0

            Premium vintage analog camera for Android — 64 camera presets, 48 film LUTs, real-time GPU color grading, D3D wigglegram, and authentic tactile UI.

            ### ⬇️ Download

            **[dazzz.apk](https://github.com/johnkurian261/Cameleo/releases/download/latest/dazzz.apk)** (~35 MB)

            ### 📲 Install

            1. Download `dazzz.apk` on your Android phone
            2. Enable **"Install Unknown Apps"** when prompted
            3. Tap **Install** → Open **dazzz**
            4. Grant Camera & Storage permissions
            5. Shoot with vintage film presets!

            ### ✨ What's New in v2.1.0

            - **Authentic Temperature Slider** — Pixel-matched Dazz Cam color temperature control with 11-stop gradient pill, dotted center line, and black/white ring thumb
            - **D3D Wigglegram Camera** — Multi-frame depth parallax with pinhole camera model, back-to-front compositing, and H.264 MP4 output
            - **Calibrated Depth Engine** — Face-anchored convergence pivot with depth stratification for convincing stereoscopic pop
            - **64 Camera Presets** across Analog Film, CCD Digital, Disposable, Instant, Specialty, and Camcorder categories
            - **Real-Time GPU Pipeline** — OpenGL ES 3.0 uber-fragment shader at 60 FPS
            - **59 Unit Tests** passing across all modules

          draft: false
          prerelease: false
          files: release-apk/dazzz.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
